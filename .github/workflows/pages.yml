name: Publish chat to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # O chat tem de responder o mesmo texto que o bot do WhatsApp.
      - name: Run parity tests
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # So a pagina vai ao ar; os testes e os dados de teste ficam no repositorio.
      - name: Build site folder
        run: |
          mkdir site
          cp index.html app.js bot.js .nojekyll site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
