<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1a17">
  <title>Tabela de preços</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6b55'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='%23fff' stroke-width='3'/%3E%3Cpath d='m19 19 6 6' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      --page: #eef1ee;
      --surface: #ffffff;
      --ink: #17211e;
      --muted: #5c6b66;
      --line: #d9dfdb;
      --accent: #0f6b55;
      --accent-ink: #ffffff;
      --mine: #d9f2e7;
      --code: #e6ece9;
      --warn: #a15c00;
      --header: #0f1a17;
      --header-ink: #f2f6f4;
      --header-muted: #a9b8b2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0c1210;
        --surface: #17201d;
        --ink: #e9efec;
        --muted: #9aaaa4;
        --line: #2a3632;
        --accent: #35b592;
        --accent-ink: #06231b;
        --mine: #124536;
        --code: #24302c;
        --warn: #f0b45a;
        --header: #131c19;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    header {
      background: var(--header);
      color: var(--header-ink);
      padding: 12px 16px;
      padding-top: max(12px, env(safe-area-inset-top));
    }
    header .inner, main .inner, footer .inner { max-width: 760px; margin: 0 auto; }
    h1 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
    #status { margin: 2px 0 0; font-size: 13px; color: var(--header-muted); }
    #status.warn { color: #f0b45a; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .pdf {
      flex: none;
      padding: 8px 12px;
      border: 1px solid #3d4f48;
      border-radius: 10px;
      color: var(--header-ink);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .pdf:hover { border-color: var(--header-ink); }

    main { flex: 1; overflow-y: auto; padding: 16px; overscroll-behavior: contain; }
    #log { display: flex; flex-direction: column; gap: 10px; }
    .msg {
      max-width: min(100%, 680px);
      padding: 10px 12px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }
    .msg.user { align-self: flex-end; background: var(--mine); border-bottom-right-radius: 4px; max-width: 85%; }
    .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg p { margin: 0; }
    .msg .gap { height: 8px; }
    .msg .item { padding: 6px 0 6px 12px; border-left: 2px solid var(--line); margin: 4px 0; }
    .msg .sub { padding-left: 14px; color: var(--muted); font-size: 14px; margin-top: -2px; }
    .msg .note { color: var(--muted); font-size: 13px; }
    .msg strong { font-weight: 650; }
    .msg em { font-style: normal; color: var(--muted); }
    .code {
      font: 12px/1 ui-monospace, "Cascadia Mono", Consolas, monospace;
      background: var(--code);
      padding: 2px 5px;
      border-radius: 5px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    .try {
      border: 0;
      background: none;
      padding: 0;
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 16px; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    #chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
    #chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: none;
      border: 1px solid var(--line);
      background: var(--page);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
    }
    .chip:hover { border-color: var(--accent); }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 16px; /* abaixo disso o iPhone dá zoom ao focar */
      color: var(--ink);
      background: var(--page);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    input::placeholder { color: var(--muted); }
    form button {
      flex: none;
      border: 0;
      border-radius: 12px;
      padding: 0 16px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 600;
    }
    form button:disabled { opacity: 0.5; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <div class="inner bar">
      <div>
        <h1>Tabela de preços</h1>
        <p id="status">Carregando os preços…</p>
      </div>
      <a id="pdf" class="pdf" href="./tabela-precos.pdf" download="tabela-de-precos.pdf">Tabela em PDF</a>
    </div>
  </header>

  <main id="scroll">
    <div class="inner">
      <div id="log" role="log" aria-live="polite"></div>
    </div>
  </main>

  <footer>
    <div class="inner">
      <div id="chips" aria-label="Exemplos">
        <button class="chip" type="button" data-q="enantato">enantato</button>
        <button class="chip" type="button" data-q="retatrutida">retatrutida</button>
        <button class="chip" type="button" data-q="oxandrolona 10mg">oxandrolona 10mg</button>
        <button class="chip" type="button" data-q="/comparar zphc cooper">/comparar zphc cooper</button>
        <button class="chip" type="button" data-q="/help">/help</button>
      </div>
      <form id="form" autocomplete="off">
        <input id="input" type="text" inputmode="text" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Produto ou marca" aria-label="O que você procura">
        <button id="send" type="submit" disabled>Buscar</button>
      </form>
    </div>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
